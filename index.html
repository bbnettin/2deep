<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mainframe® — Creative Agency</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium">
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg">

  <!-- Custom styles -->
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- Fullscreen scrub-controlled video -->
  <video
    id="bg-video"
    class="bg-video"
    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260530_042513_df96a13b-6155-4f6e-8b93-c9dee66fba08.mp4"
    muted
    playsinline
    preload="auto"
    autoplay
  ></video>

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 w-full z-10 px-5 sm:px-8 py-4 sm:py-5 flex justify-between items-center">
    <!-- Logo -->
    <a href="#" class="flex items-center gap-3">
      <span class="logo-text text-[21px] sm:text-[26px] tracking-tight text-black">Mainframe®</span>
      <span class="text-[25px] sm:text-[30px] text-black select-none" style="letter-spacing: -0.02em;">✳︎</span>
    </a>

    <!-- Desktop nav links -->
    <div class="hidden md:flex items-center text-[23px] text-black">
      <a href="#" class="hover:opacity-60 transition-opacity">Labs</a><span class="mr-1">,</span>
      <a href="#" class="hover:opacity-60 transition-opacity">Studio</a><span class="mr-1">,</span>
      <a href="#" class="hover:opacity-60 transition-opacity">Openings</a><span class="mr-1">,</span>
      <a href="#" class="hover:opacity-60 transition-opacity">Shop</a>
    </div>

    <!-- Desktop CTA -->
    <a href="#" class="hidden md:inline-block text-[23px] text-black underline underline-offset-2 hover:opacity-60 transition-opacity">
      Get in touch
    </a>

    <!-- Mobile hamburger -->
    <button id="hamburger" class="hamburger md:hidden flex flex-col gap-[5px]" aria-label="Menu" aria-expanded="false">
      <span id="bar1" class="bar w-6 h-[2px] bg-black"></span>
      <span id="bar2" class="bar w-6 h-[2px] bg-black"></span>
      <span id="bar3" class="bar w-6 h-[2px] bg-black"></span>
    </button>
  </nav>

  <!-- Mobile overlay -->
  <div id="mobile-overlay" style="z-index: 9" class="fixed inset-0 bg-white/95 backdrop-blur-sm flex flex-col items-start justify-center px-8 gap-8 md:hidden">
    <a href="#" class="mobile-link text-[32px] font-medium text-black hover:opacity-60 transition-opacity">Labs</a>
    <a href="#" class="mobile-link text-[32px] font-medium text-black hover:opacity-60 transition-opacity">Studio</a>
    <a href="#" class="mobile-link text-[32px] font-medium text-black hover:opacity-60 transition-opacity">Openings</a>
    <a href="#" class="mobile-link text-[32px] font-medium text-black hover:opacity-60 transition-opacity">Shop</a>
    <a href="#" class="mobile-link text-[32px] font-medium text-black underline underline-offset-2 hover:opacity-60 transition-opacity">Get in touch</a>
  </div>

  <!-- Hero section -->
  <main style="z-index: 1" class="relative h-screen flex flex-col justify-end pb-12 md:justify-center md:pb-0 px-5 sm:px-8 md:px-10 overflow-hidden">
    <div class="max-w-xl relative z-10">
      <!-- Blurred intro label -->
      <div class="intro-label mb-5 sm:mb-6 pointer-events-none select-none">
        Hey there, meet A.R.I.A,<br>
        Mainframe's Adaptive Response Interface Agent
      </div>

      <!-- Typewriter text -->
      <p id="typewriter" class="typewriter-text mb-5 sm:mb-6">
        <span id="typewriter-text"></span>
        <span id="typing-cursor" class="typing-cursor"></span>
      </p>

      <!-- Action pills -->
      <div id="action-pills" class="fade-slide flex flex-wrap gap-y-1">
        <button type="button" class="inline-flex items-center justify-center bg-white text-black border border-black/10 rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap hover:bg-black hover:text-white transition-colors duration-200">
          Pitch us an idea
        </button>
        <button type="button" class="inline-flex items-center justify-center bg-white text-black border border-black/10 rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap hover:bg-black hover:text-white transition-colors duration-200">
          Come work here
        </button>
        <button type="button" class="inline-flex items-center justify-center bg-white text-black border border-black/10 rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap hover:bg-black hover:text-white transition-colors duration-200">
          Send a brief hello
        </button>
        <button type="button" class="inline-flex items-center justify-center bg-white text-black border border-black/10 rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap hover:bg-black hover:text-white transition-colors duration-200">
          See how we operate
        </button>

        <!-- Outline copy-email pill -->
        <button id="copy-email" type="button" class="inline-flex items-center justify-center text-white bg-transparent border border-white rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap gap-2 sm:gap-3 hover:bg-white hover:text-black transition-colors duration-200" aria-label="Copy hello@mainframe.co">
          <span>Reach us: <span class="underline underline-offset-1">hello@mainframe.co</span></span>
          <svg class="w-3 h-3 shrink-0" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1">
            <rect x="4.5" y="4.5" width="6" height="6" rx="1"/>
            <path d="M3 8V3.5A1.5 1.5 0 0 1 4.5 2H8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
